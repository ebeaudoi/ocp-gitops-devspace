---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - appproject.yaml
  - application.yaml

patches:
  - target:
      kind: Application
      name: devspaces
    patch: |-
      - op: replace
        path: /spec/source/repoURL
        value: https://github.com/ebeaudoi/ocp-gitops-devspace.git
      - op: replace
        path: /spec/source/targetRevision
        value: main
  - target:
      kind: AppProject
      name: devspaces
    patch: |-
      - op: replace
        path: /spec/sourceRepos/0
        value: https://github.com/ebeaudoi/ocp-gitops-devspace.git
      - op: replace
        path: /spec/sourceRepos/1
        value: git@github.com:ebeaudoi/ocp-gitops-devspace.git
