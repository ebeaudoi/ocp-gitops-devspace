# Allow Dev Spaces pods to talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-devspaces
  namespace: openshift-devspaces
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-devspaces
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow OpenShift router (and other ingress controllers) to reach the gateway.
# Without this, the Route returns "Application is not available" even when pods are Ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-ingress
  namespace: openshift-devspaces
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
  podSelector: {}
  policyTypes:
    - Ingress
